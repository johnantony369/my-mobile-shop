<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyShop" />
    <title>My Mobile Shop</title>
    <meta name="description" content="My Mobile Shop - Lightweight, offline-ready digital day book and customer repair tracking application for mobile retail and service shops." />
    <meta name="keywords" content="mobile shop day book, repair tracking ledger, kerala mobile shop, digital ledger, shop accounts" />
    <link rel="canonical" href="https://www.mymobileshop.online/" />
    <meta property="og:title" content="My Mobile Shop - Digital Day Book & Repair Tracker" />
    <meta property="og:description" content="Manage daily shop cash flow, track customer phone repairs, and securely sync records." />
    <meta property="og:url" content="https://www.mymobileshop.online/" />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-iosBg text-iosLabel antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script>
      // Global fallback in case of stale cache or script loading failure
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          root.innerHTML = '<div style="font-family: -apple-system, sans-serif; padding: 24px; text-align: center; background: #F2F2F7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;"><div style="width: 56px; height: 56px; border-radius: 16px; background: #FF3B30; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 16px;">!</div><h3 style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading Error</h3><p style="color: #8E8E93; font-size: 13px; margin-bottom: 20px;">' + (e.message || 'Failed to load app scripts') + '</p><button onclick="if(window.caches) { caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); window.location.reload(true); }); } else { window.location.reload(true); }" style="padding: 12px 24px; background: #007AFF; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;">Clear Cache & Reload</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
